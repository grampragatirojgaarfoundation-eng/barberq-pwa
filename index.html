<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberQ - Live Salon Platform</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <!-- PDF GENERATOR LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .uidai-slot { transition: all 0.2s ease; }
    .uidai-slot.selected { background-color: #0369a1; color: white; border-color: #0369a1; }
    
    @media print {
      body * { visibility: hidden; }
      #printable-slip, #printable-slip * { visibility: visible; }
      #printable-slip { position: absolute; left: 0; top: 0; width: 100%; border:none !important; background: white !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

  <header class="bg-slate-800 p-4 sticky top-0 z-40 shadow-md flex justify-between items-center border-b border-slate-700">
    <h1 class="text-xl font-bold text-amber-400">✂️ BarberQ</h1>
    <div class="flex space-x-2">
      <button type="button" onclick="loginAsOwner()" class="text-xs text-amber-400 underline p-2">Owner Login</button>
      <button type="button" onclick="openFormModal('register')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-sm font-bold px-3 py-1.5 rounded-lg">+ Add Salon</button>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-2xl mx-auto w-full space-y-4">
    <div id="map" class="h-56 w-full rounded-xl border border-slate-700 z-0"></div>
    <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">Salons near you</h2>
    <div id="shop-list" class="space-y-4"></div>
  </main>

  <!-- FULL SCREEN PROFILE MODAL -->
  <div id="profile-modal" class="fixed inset-0 bg-slate-900 z-50 hidden flex-col overflow-y-auto">
    <div class="sticky top-0 bg-slate-800/90 backdrop-blur p-4 flex justify-between items-center border-b border-slate-700 z-10">
      <button type="button" onclick="closeProfile()" class="text-white bg-slate-700 px-3 py-1 rounded-full text-sm font-bold">← Back</button>
      <div id="owner-actions" class="hidden space-x-2">
        <button type="button" onclick="openFormModal('edit')" class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded font-bold">Edit Settings</button>
      </div>
    </div>

    <div class="p-4 space-y-6 max-w-2xl mx-auto w-full pb-20">
      <div>
        <h2 id="prof-name" class="text-3xl font-black text-amber-400 leading-tight"></h2>
        <p id="prof-address" class="text-sm text-slate-400 mt-1">📍 </p>
      </div>

      <!-- 5 PHOTOS BEAUTIFUL GRID VIEW -->
      <div>
         <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Gallery</h3>
         <div id="prof-gallery" class="grid grid-cols-4 gap-2"></div>
      </div>

      <!-- UIDAI STYLE BOOKING UI -->
      <div class="bg-slate-100 p-5 rounded-2xl border border-slate-300 text-slate-900 shadow-xl relative">
        <div id="closed-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-20 hidden items-center justify-center rounded-2xl">
            <h2 class="text-3xl font-black text-red-600 border-4 border-red-600 p-4 rounded-lg transform -rotate-12 bg-white">SHOP CLOSED</h2>
        </div>

        <h3 class="text-lg font-bold text-blue-900 mb-2 border-b border-blue-200 pb-2">Book Appointment (Token)</h3>
        <label class="block text-xs font-bold text-slate-500 mb-1">Select Date (Up to 5 Days in advance)</label>
        <input type="date" id="book-date" class="w-full bg-white border-2 border-blue-300 p-2.5 rounded-lg text-slate-900 mb-4 font-bold outline-none focus:border-blue-600" onchange="loadSlots()">

        <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
           <div class="flex justify-between text-xs font-bold text-blue-800 mb-3 px-1">
              <span>Total Tokens: <span id="slot-total-tokens">0</span></span>
              <span>Available: <span id="slot-avail-tokens">0</span></span>
           </div>
           <div id="slot-grid" class="grid grid-cols-3 gap-2 max-h-56 overflow-y-auto pr-1"></div>
        </div>

        <div class="mt-4 space-y-2">
            <div id="prof-services" class="space-y-2 max-h-32 overflow-y-auto p-1 bg-white border border-slate-200 rounded-lg shadow-inner"></div>
            <input type="text" id="cust-name" placeholder="Your Name" class="w-full border-2 border-slate-300 p-2.5 rounded-lg text-sm text-slate-900">
            <input type="tel" id="cust-phone" placeholder="Mobile Number" class="w-full border-2 border-slate-300 p-2.5 rounded-lg text-sm text-slate-900">
            <button type="button" id="book-btn" onclick="confirmBooking()" class="w-full bg-blue-700 hover:bg-blue-800 font-bold py-3 text-white rounded-xl shadow-lg mt-2 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
              Confirm Appointment
            </button>
        </div>
      </div>

      <!-- OWNER LIVE DASHBOARD -->
      <div id="owner-dashboard" class="hidden bg-slate-800 p-4 rounded-xl border border-amber-500/50 mt-4">
        <h3 class="text-amber-400 font-bold text-sm mb-2">👑 Live Bookings (Datewise)</h3>
        <div id="owner-bookings-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-2 flex-col">
    <button type="button" onclick="closeLightbox()" class="absolute top-5 right-5 text-white text-3xl font-bold p-2">&times;</button>
    <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded transition-transform duration-300">
  </div>

  <!-- DOWNLOADABLE TOKEN SLIP MODAL (PDF Wrapper) -->
  <div id="token-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-[60]">
    <div class="bg-white p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto hide-scrollbar">
      <h2 class="text-2xl font-bold text-green-600 border-b pb-2 no-print">Booking Confirmed!</h2>
      
      <div id="printable-slip" class="bg-blue-50 p-6 rounded-xl border-2 border-dashed border-blue-400 text-center">
        <p class="text-[12px] text-slate-500 font-bold uppercase tracking-wide">BarberQ E-Token</p>
        <p id="display-shop-name" class="font-black text-xl text-slate-800 mt-2"></p>
        <p id="display-shop-address" class="text-xs text-slate-600 mt-1"></p>
        <p id="display-shop-phone" class="text-xs text-slate-600 font-bold mb-4"></p>
        
        <p class="text-sm text-slate-500 font-bold border-t border-slate-300 pt-4">Token Number</p>
        <p id="display-token" class="text-4xl font-black text-blue-900 tracking-widest my-2"></p>
        
        <p class="text-sm text-slate-500 font-bold mt-2">Customer Name</p>
        <p id="display-cust-name" class="text-md font-bold text-slate-700"></p>

        <p class="text-sm text-slate-500 font-bold mt-2">Appointment Date & Time</p>
        <p id="display-time" class="text-md font-bold text-slate-800 bg-white p-2 rounded mt-1 border border-slate-300"></p>
      </div>

      <div class="flex space-x-2 no-print">
         <button type="button" id="pdf-download-btn" onclick="downloadTokenPDF()" class="w-1/2 bg-blue-600 text-white text-sm font-bold py-3 rounded-lg shadow-lg">Download PDF</button>
         <button type="button" onclick="closeTokenModal()" class="w-1/2 bg-slate-900 text-white text-sm font-bold py-3 rounded-lg shadow-lg">Close Window</button>
      </div>
    </div>
  </div>

  <!-- FIX 2: FORM MODAL WITH CORRECT SCROLLING (max-h-90vh) -->
  <div id="form-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[70]">
    <div class="bg-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 border border-slate-700 relative max-h-[90vh] overflow-y-auto hide-scrollbar">
      <button type="button" onclick="closeFormModal()" class="absolute top-3 right-3 text-slate-400 text-xl">&times;</button>
      <h3 id="form-title" class="text-lg font-bold text-amber-400">Salon Setup</h3>
      
      <div class="space-y-3">
        <input type="hidden" id="form-shopId">
        <input type="text" id="reg-name" placeholder="Salon Name" class="w-full bg-slate-900 border border-slate-600 p-2.5 rounded text-sm text-white">
        <input type="text" id="reg-owner" placeholder="Owner Name" class="w-full bg-slate-900 border border-slate-600 p-2.5 rounded text-sm text-white">
        <input type="text" id="reg-phone" placeholder="Registered Phone" class="w-full bg-slate-900 border border-slate-600 p-2.5 rounded text-sm text-white">
        <input type="text" id="reg-address" placeholder="Full Address" class="w-full bg-slate-900 border border-slate-600 p-2.5 rounded text-sm text-white">
        
        <div class="flex space-x-2">
          <div class="w-1/2"><label class="text-[10px] text-slate-400">Open Time</label><input type="time" id="reg-open" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white"></div>
          <div class="w-1/2"><label class="text-[10px] text-slate-400">Close Time</label><input type="time" id="reg-close" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white"></div>
        </div>
        
        <div class="flex space-x-2">
          <div class="w-1/2"><label class="text-[10px] text-slate-400">Slot Duration (Mins)</label><input type="number" id="reg-dur" value="30" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white"></div>
          <div class="w-1/2"><label class="text-[10px] text-slate-400">Capacity/Chairs</label><input type="number" id="reg-chair" value="1" class="w-full bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white"></div>
        </div>

        <!-- HOLIDAY RANGE MANAGER -->
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
            <h4 class="text-[11px] font-bold text-red-400 mb-2">Mark Closed Dates (Holidays)</h4>
            <div class="flex space-x-2 mb-2 items-end">
                <div class="w-1/2"><label class="text-[10px] text-slate-400">From Date</label><input type="date" id="holiday-start" class="w-full bg-slate-800 p-2 rounded text-xs text-white border border-slate-600"></div>
                <div class="w-1/2"><label class="text-[10px] text-slate-400">To Date</label><input type="date" id="holiday-end" class="w-full bg-slate-800 p-2 rounded text-xs text-white border border-slate-600"></div>
                <button type="button" onclick="addHolidayRange()" class="bg-slate-700 px-3 py-2 rounded text-xs text-white font-bold">Add</button>
            </div>
            <div id="holiday-list" class="flex flex-wrap gap-2 mt-2"></div>
        </div>

        <div class="flex space-x-2">
          <input type="number" step="any" id="reg-lat" placeholder="Latitude" class="w-1/2 bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white">
          <input type="number" step="any" id="reg-lng" placeholder="Longitude" class="w-1/2 bg-slate-900 border border-slate-600 p-2 rounded text-sm text-white">
          <button type="button" onclick="getCurrentLocationForReg()" class="bg-slate-700 px-3 rounded text-xs text-white font-bold">Auto</button>
        </div>

        <label class="block text-[11px] text-amber-400 font-bold">Upload Photos (Max 5, Max 1MB Each)</label>
        <div class="flex items-center space-x-2">
           <button type="button" onclick="document.getElementById('reg-photos').click()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 text-xs font-bold rounded text-white">+ Pick Photo</button>
           <span id="photo-count-text" class="text-xs text-slate-400">0/5 added</span>
        </div>
        <input type="file" id="reg-photos" multiple accept="image/*" class="hidden" onchange="handlePhotoSelect(this)">
        <div id="photo-preview-list" class="flex flex-wrap gap-2 mt-2"></div>

        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
            <h4 class="text-sm font-bold text-amber-400 mb-2">Services</h4>
            <div id="dynamic-services" class="space-y-2"></div>
            <button type="button" onclick="addServiceRow()" class="text-xs text-amber-400 mt-2 font-bold">+ Add Service</button>
        </div>
      </div>
      
      <button type="button" id="submit-btn" onclick="submitForm()" class="w-full bg-amber-500 font-bold py-3 text-slate-900 rounded-xl mt-4">Save Profile</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
